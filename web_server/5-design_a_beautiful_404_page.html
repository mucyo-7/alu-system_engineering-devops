<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 - Page Not Found</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f, #2b2b45);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #f2f2f2;
    text-align: center;
  }
  .container {
    max-width: 500px;
  }
  h1 {
    font-size: 8rem;
    margin: 0;
    background: linear-gradient(90deg, #ff6b6b, #f7c948);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p {
    font-size: 1.3rem;
    margin-top: 0.5rem;
  }
  .subtitle {
    font-size: 1rem;
    color: #aaa;
    margin-top: 1rem;
  }
  a {
    display: inline-block;
    margin-top: 2rem;
    padding: 0.7rem 1.5rem;
    background: #f7c948;
    color: #1e1e2f;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: transform 0.2s ease;
  }
  a:hover {
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Ceci n'est pas une page</p>
    <p class="subtitle">The page you're looking for doesn't exist, or has wandered off somewhere.</p>
    <a href="/">Take me home</a>
  </div>
</body>
</html>
